name: 'bekci: AI agent security scan'
description: 'Scan agent skills, MCP servers, hooks and permissions for prompt injection, leaked secrets and supply-chain risks.'
author: 'Yusuf Sizmaz'
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: 'Directory to scan, relative to the workspace.'
    default: '.'
  fail-on:
    description: 'Fail on findings at or above this severity: critical | high | medium | low | none. Empty = use .bekci.json, else "high".'
    default: ''
  min-severity:
    description: 'Hide findings below this severity. Empty = use .bekci.json, else "low".'
    default: ''
  upload-sarif:
    description: 'Upload results to GitHub code scanning (needs `security-events: write`).'
    default: 'true'
  args:
    description: 'Extra CLI arguments, e.g. "--ignore BK201".'
    default: ''

outputs:
  grade:
    description: 'Overall grade, A to F.'
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: 'Score out of 100.'
    value: ${{ steps.scan.outputs.score }}
  findings:
    description: 'Number of reported findings.'
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # Builds bekci from the exact ref the workflow pinned instead of downloading a package at
    # run time. Uses the runner's Node (18.18+; preinstalled on GitHub-hosted runners) so the
    # Node version of later steps in your job is not changed.
    - name: Build bekci
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<18||(a===18&&b<18)) { console.error("bekci needs Node 18.18+ on the runner (add actions/setup-node)"); process.exit(1) }'
        npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
        npx tsc -p tsconfig.json

    - name: Scan
      id: scan
      shell: bash
      env:
        BEKCI: ${{ github.action_path }}/dist/cli.js
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        EXTRA_ARGS: ${{ inputs.args }}
        FORCE_COLOR: '1'
      run: |
        args=("$SCAN_PATH" --no-user -o "$RUNNER_TEMP/bekci.json" -o "$RUNNER_TEMP/bekci.sarif" -o "$RUNNER_TEMP/bekci.md")
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$MIN_SEVERITY" ] && args+=(--min-severity "$MIN_SEVERITY")
        # Word-splitting of extra args is intentional.
        # shellcheck disable=SC2206
        args+=($EXTRA_ARGS)
        set +e
        node "$BEKCI" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$RUNNER_TEMP/bekci.json" ]; then
          cat "$RUNNER_TEMP/bekci.md" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require(process.argv[1]); console.log(`grade=${r.grade}\nscore=${r.score}\nfindings=${r.findings.length}`)' "$RUNNER_TEMP/bekci.json" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF
      # `grade` is only set when the scan produced its reports (hashFiles cannot see runner.temp).
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.grade != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/bekci.sarif
        category: bekci/${{ inputs.path }}

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "bekci: passed" ;;
          1) echo "::error title=bekci::Findings at or above the fail-on severity. See the job summary or code scanning alerts."; exit 1 ;;
          *) echo "::error title=bekci::Scan failed or was incomplete (exit code $CODE)."; exit "$CODE" ;;
        esac
