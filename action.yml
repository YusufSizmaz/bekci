name: 'bekci: AI agent security scan'
description: 'Scan agent skills, MCP servers, hooks and permissions for prompt injection, leaked secrets and supply-chain risks.'
author: 'Yusuf Sizmaz'
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: 'Directory to scan.'
    default: '.'
  fail-on:
    description: 'Fail the job on findings at or above this severity: critical | high | medium | low | none.'
    default: 'high'
  min-severity:
    description: 'Hide findings below this severity.'
    default: 'low'
  upload-sarif:
    description: 'Upload results to GitHub code scanning (needs `security-events: write`).'
    default: 'true'
  args:
    description: 'Extra CLI arguments, e.g. "--ignore BK201".'
    default: ''

outputs:
  grade:
    description: 'Overall grade, A to F.'
    value: ${{ steps.scan.outputs.grade }}
  findings:
    description: 'Number of findings at or above min-severity.'
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # Uses the runner's Node (18+, preinstalled on GitHub-hosted runners) so the action does
    # not change the Node version for later steps in your job.
    # Builds from the exact action ref the workflow pinned, instead of pulling a package
    # from the registry at run time.
    - name: Build bekci
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error && npx tsc -p tsconfig.json

    - name: Scan
      id: scan
      shell: bash
      env:
        BEKCI: ${{ github.action_path }}/dist/cli.js
        SCAN_PATH: ${{ inputs.path }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086
        node "$BEKCI" "$SCAN_PATH" --no-user --min-severity "$MIN_SEVERITY" --fail-on none $EXTRA_ARGS -f json -o "$RUNNER_TEMP/bekci.json"
        node "$BEKCI" "$SCAN_PATH" --no-user --min-severity "$MIN_SEVERITY" --fail-on none $EXTRA_ARGS -f sarif -o "$RUNNER_TEMP/bekci.sarif"
        node "$BEKCI" "$SCAN_PATH" --no-user --min-severity "$MIN_SEVERITY" --fail-on none $EXTRA_ARGS -f markdown >> "$GITHUB_STEP_SUMMARY"
        node -e 'const r=require(process.argv[1]); console.log(`grade=${r.grade}\nfindings=${r.findings.length}`)' "$RUNNER_TEMP/bekci.json" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/bekci.sarif
        category: bekci

    - name: Report
      shell: bash
      env:
        BEKCI: ${{ github.action_path }}/dist/cli.js
        SCAN_PATH: ${{ inputs.path }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXTRA_ARGS: ${{ inputs.args }}
        FORCE_COLOR: '1'
      run: |
        # shellcheck disable=SC2086
        node "$BEKCI" "$SCAN_PATH" --no-user --min-severity "$MIN_SEVERITY" --fail-on "$FAIL_ON" $EXTRA_ARGS
