name: False positive
description: bekci flagged something that is safe
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: BK005
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal snippet that triggers it
      description: Remove secrets and private paths. A few lines of the skill, config or instruction file is enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this safe?
  - type: input
    id: version
    attributes:
      label: bekci version
      placeholder: "0.1.0"
