name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Trusted publishing (OIDC): no npm token is stored in this repository. The trusted
      # publisher is configured on npmjs.com for YusufSizmaz/bekci + release.yml, and
      # provenance is attached automatically. npm stages the version; a maintainer approves
      # it with 2FA (npm stage approve / npmjs.com) before it becomes installable.
      - name: Publish to npm (staged)
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "bekci@$version" version >/dev/null 2>&1; then
            echo "bekci@$version is already on npm; skipping publish."
            exit 0
          fi
          npm install --global npm@11.21.2
          npm stage publish --access public
          echo "::notice title=Approve bekci@$version::npm staged the release. Approve it on npmjs.com or run: npx npm@latest stage list bekci && npx npm@latest stage approve <stage-id>"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes = this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          # Relative links do not resolve on the release page; point them at the tagged tree.
          sed -E -i "s#\]\(([^):#][^)]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
